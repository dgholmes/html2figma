<!doctype html>
<html><head><meta charset="utf-8"><title>Media fixture</title>
<style> body { margin: 0; padding: 40px; display: grid; gap: 24px; grid-template-columns: repeat(2, 240px); } .box { width: 240px; height: 160px; } </style></head>
<body>
<img class="box" style="object-fit: cover" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='480' height='240'%3E%3Crect width='480' height='240' fill='%2306c'/%3E%3Ccircle cx='120' cy='120' r='80' fill='%23fc0'/%3E%3C/svg%3E">
<video class="box" poster="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='160'%3E%3Crect width='240' height='160' fill='%23c06'/%3E%3C/svg%3E" muted></video>
<canvas class="box" id="c" width="240" height="160"></canvas>
<div class="box" style="background: url(&quot;data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='40'%3E%3Crect width='20' height='20' fill='%23000'/%3E%3C/svg%3E&quot;) repeat"></div>
<iframe class="box" src="about:blank"></iframe>
<script>const ctx = document.getElementById('c').getContext('2d'); ctx.fillStyle = '#0a7'; ctx.fillRect(0, 0, 240, 160); ctx.fillStyle = '#fff'; ctx.font = '32px sans-serif'; ctx.fillText('canvas', 60, 90);</script>
</body></html>
