<!doctype html>
<html><head><meta charset="utf-8"><title>Styles fixture</title>
<style>
  body { margin: 0; padding: 40px; font-family: Georgia, serif; }
  .card { width: 320px; padding: 24px; border-radius: 16px; background: linear-gradient(135deg, #ff7a18, #af002d 70%); box-shadow: 0 12px 32px rgba(0,0,0,.35); color: #fff; }
  .card h2 { margin: 0 0 8px; font: italic 700 28px/1.2 Georgia, serif; letter-spacing: -0.5px; }
  .card p { margin: 0; opacity: .85; }
  .badge { display: inline-block; padding: 4px 10px; border: 2px dashed #fff; border-radius: 999px; text-transform: uppercase; font-size: 12px; }
  .rotated { width: 120px; height: 60px; background: #222; transform: rotate(-8deg); margin-top: 40px; }
  .icon { width: 48px; height: 48px; color: #0a7; }
  .ring::before { content: ""; position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: red; }
  .ring { position: relative; width: 100px; height: 100px; background: #ddd; margin-top: 24px; }
  input { display: block; margin-top: 24px; width: 240px; padding: 10px 12px; border: 1px solid #999; border-radius: 6px; }
</style></head>
<body>
<div class="card"><h2>Make your photos look <em>published.</em></h2><p>Layered <b>bold</b> and <a href="#" style="color:#ffe">linked</a> text.</p><span class="badge">new</span></div>
<div class="rotated"></div>
<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8 12h8" stroke="#fff" stroke-width="2"/></svg>
<div class="ring"></div>
<input placeholder="Your email">
<button style="margin-top:12px;padding:8px 16px;background:#111;color:#fff;border:0;border-radius:8px">Join</button>
</body></html>
