<!doctype html>
<html><head><meta charset="utf-8"><title>Reveal fixture</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: oklch(0.15 0.004 95); color: #fff; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(0,0,0,.6); display: flex; align-items: center; padding: 0 24px; }
  section { min-height: 100vh; padding: 120px 48px; box-sizing: border-box; }
  .reveal { opacity: 0; transform: translateY(24px); transition: all .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .never { opacity: 0; transition: all .6s ease; }
  .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* I7: a canonical hidden-overlay pattern (modal/drawer/tooltip/cookie banner) — opacity: 0,
     visibility: hidden, centered with a large translate(-50%, -50%), and critically no opacity
     transition at all. Force-reveal must leave this alone: it is not a scroll-reveal target. */
  .overlay { position: fixed; left: 50%; top: 50%; width: 300px; height: 120px; box-sizing: border-box; padding: 16px;
    opacity: 0; visibility: hidden; transform: translate(-50%, -50%); background: #000; }
</style></head>
<body>
<header><strong>Fixture</strong></header>
<section><h1 class="reveal">Hero headline</h1><p class="reveal">Visible after scroll.</p></section>
<section style="background:#eee;color:#111"><h2 class="reveal">Second section</h2><p class="never">Never revealed by the page itself.</p><div class="spinner"></div></section>
<div class="overlay">Overlay not revealed</div>
<script>
  const io = new IntersectionObserver((entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add('in')));
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body></html>
